  <text x="256" y="200" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="200" font-weight="700" fill="white">%</text>
  <!-- Linea divisore -->
  <rect x="80" y="300" width="352" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
