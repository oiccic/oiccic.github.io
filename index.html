<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculators">
    <meta name="theme-color" content="#f4ecd8">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Business Calculators</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4ecd8;
            color: #4a3a2a;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 30px 20px;
        }
        .logo { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; opacity: 0.9; }
        h1 { font-size: 26px; font-weight: 700; color: #4a3a2a; margin-bottom: 6px; text-align: center; }
        .subtitle { font-size: 14px; color: #7a6a5a; margin-bottom: 48px; text-align: center; }
        .card-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .card {
            display: flex; align-items: center;
            background: #e8dec8; border-radius: 20px; padding: 22px 24px;
            text-decoration: none;
            border: 1px solid #dcd0b8;
            transition: transform 0.15s, border-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.97); border-color: #8b7355; }
        .card-icon {
            width: 54px; height: 54px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; flex-shrink: 0; margin-right: 18px;
        }
        .card-icon.blue  { background: #dcd0b8; }
        .card-icon.green { background: #dcd0b8; }
        .card-icon.silver { background: #dcd0b8; }
        .card-title { font-size: 17px; font-weight: 700; color: #4a3a2a; margin-bottom: 3px; }
        .card-desc  { font-size: 13px; color: #7a6a5a; line-height: 1.4; }
        .card-arrow { font-size: 20px; color: #a39580; margin-left: 10px; }
        .footer { margin-top: 48px; font-size: 12px; color: #a39580; text-align: center; }
    </style>
</head>
<body>
    <img src="apple-touch-icon.png" class="logo" alt="Logo">
    <h1>Business Calculators</h1>
    <p class="subtitle">Choose a calculator</p>

    <div class="card-list">
        <a href="margin-ITA.html" class="card">
            <div class="card-icon blue">📊</div>
            <div style="flex:1">
                <div class="card-title">Margin Calculator</div>
                <div class="card-desc">Cost · Price · Margin %</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="discount-ITA.html" class="card">
            <div class="card-icon green">🏷️</div>
            <div style="flex:1">
                <div class="card-title">Discount Calculator</div>
                <div class="card-desc">Gross · Discount · Net</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="alu-calc.html" class="card">
            <div class="card-icon silver">🪨</div>
            <div style="flex:1">
                <div class="card-title">ALU Calculator</div>
                <div class="card-desc">LME impact · G.15 · G.20 · G.30 · G.40</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
    </div>

    <p class="footer">Tap an item to open the calculator</p>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
    });
}
</script>
</body>
</html>
