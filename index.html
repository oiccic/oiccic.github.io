<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculators">
    <meta name="theme-color" content="#1c1c1e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Business Calculators</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 30px 20px;
        }
        .logo { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
        h1 { font-size: 26px; font-weight: 700; color: #ffffff; margin-bottom: 6px; text-align: center; }
        .subtitle { font-size: 14px; color: #aeaeb2; margin-bottom: 48px; text-align: center; }
        .card-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .card {
            display: flex; align-items: center;
            background: #1c1c1e; border-radius: 20px; padding: 22px 24px;
            text-decoration: none;
            border: 1.5px solid #38383a;
            transition: transform 0.15s, border-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.97); border-color: #0a84ff; }
        .card-icon {
            width: 54px; height: 54px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; flex-shrink: 0; margin-right: 18px;
        }
        .card-icon.blue  { background: #0a1f35; }
        .card-icon.green { background: #0d2a18; }
        .card-icon.silver { background: #1a1a2e; }
        .card-title { font-size: 17px; font-weight: 700; color: #ffffff; margin-bottom: 3px; }
        .card-desc  { font-size: 13px; color: #aeaeb2; line-height: 1.4; }
        .card-arrow { font-size: 20px; color: #48484a; margin-left: 10px; }
        .footer { margin-top: 48px; font-size: 12px; color: #48484a; text-align: center; }
    </style>
</head>
<body>
    <img src="apple-touch-icon.png" class="logo" alt="Logo">
    <h1>Business Calculators</h1>
    <p class="subtitle">Choose a calculator</p>

    <div class="card-list">
        <a href="margin-ITA.html" class="card">
            <div class="card-icon blue">📊</div>
            <div style="flex:1">
                <div class="card-title">Margin Calculator</div>
                <div class="card-desc">Cost · Price · Margin %</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="discount-ITA.html" class="card">
            <div class="card-icon green">🏷️</div>
            <div style="flex:1">
                <div class="card-title">Discount Calculator</div>
                <div class="card-desc">Gross · Discount · Net</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="alu-calc.html" class="card">
            <div class="card-icon silver">🪨</div>
            <div style="flex:1">
                <div class="card-title">ALU Calculator</div>
                <div class="card-desc">LME impact · G.15 · G.20 · G.30 · G.40</div>
            </div>
            <span class="card-arrow">›</span>
        </a>
    </div>

    <p class="footer">Tap an item to open the calculator</p>
</body>
</html>
