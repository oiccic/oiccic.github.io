<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Margins">
    <meta name="theme-color" content="#f4ecd8">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Margin Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4ecd8;
            display: flex; justify-content: center;
            padding: 20px; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 500px;
            background: #e8dec8; padding: 28px 20px;
            border-radius: 24px; border: 1px solid #dcd0b8;
            align-self: flex-start;
        }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; text-align: center; color: #4a3a2a; }
        .status-bar {
            text-align: center; font-size: 15px; font-weight: 500;
            color: #8b7355; margin-bottom: 24px; min-height: 20px; transition: color 0.3s;
        }
        .status-bar.active { color: #556b2f; }
        .input-group { margin-bottom: 16px; }
        .label-row { display: flex; align-items: center; margin-bottom: 7px; margin-left: 2px; }
        label { font-size: 15px; font-weight: 700; color: #8b7355; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-wrap { display: flex; align-items: center; gap: 8px; }

        input {
            flex: 1; padding: 15px 14px;
            border: 1px solid #c0b090; border-radius: 13px;
            font-size: 20px; outline: none;
            background: #fcfaf5; color: #4a3a2a;
            min-width: 0; text-align: right; font-variant-numeric: tabular-nums;
            transition: border-color 0.2s, background-color 0.2s;
            -webkit-appearance: none;
        }
        input::placeholder { color: #b8a990; }
        input:focus   { border-color: #8b7355; background: #f4ecd8; }
        input.locked  { border-color: #b8860b; background: #e8d0a0; color: #5a4a2a; font-weight: 700; }
        input.output  { border-color: #8b7355; background: #dcd0b8; color: #4a3a2a; font-weight: 700; }
        input.flash   { background: #d0dec8 !important; border-color: #556b2f !important; transition: none; }
        input.accepted { border-color: #556b2f; background: #d0dec8; }

        .stepper { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
        .step-btn {
            width: 40px; height: 27px;
            border: 1px solid #c0b090; border-radius: 8px;
            background: #dcd0b8; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #4a3a2a; font-weight: 600;
            transition: all 0.15s; -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .step-btn:active { background: #c0b090; transform: scale(0.93); }

        .lock-btn {
            flex-shrink: 0; width: 46px; height: 56px;
            border: 1px solid #c0b090; border-radius: 13px;
            background: #dcd0b8; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .lock-btn.locked { background: #b8860b; border-color: #b8860b; color: #fff; }

        .btn {
            width: 100%; background: #8b7355; color: #ffffff; border: none;
            padding: 17px; border-radius: 15px; font-size: 18px; font-weight: 700;
            cursor: pointer; margin-top: 10px; transition: all 0.15s;
        }
        .btn:active  { background: #5a4a35; transform: scale(0.98); }
        .btn:disabled { background: #dcd0b8; color: #a39580; cursor: not-allowed; transform: none; border: 1px solid #c0b090; }
        .btn.ready   { box-shadow: 0 0 0 3px rgba(139,115,85,0.2); }
        .btn-secondary {
            width: 100%; background: transparent; color: #a52a2a; border: none;
            padding: 14px; border-radius: 15px; font-size: 17px; font-weight: 600;
            cursor: pointer; margin-top: 4px;
        }
        .hint { font-size: 15px; color: #8b7355; text-align: center; margin-top: 14px; line-height: 1.6; }
        .hint b { color: #b8860b; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <h1>Margin Calculator</h1>
    <div class="status-bar" id="statusBar">Enter two values and press Calculate</div>

    <div class="input-group">
        <div class="label-row"><label>Cost (€)</label></div>
        <div class="input-wrap">
            <button class="lock-btn" tabindex="-1" id="lock-costo" onclick="toggleLock('costo')">🔓</button>
            <input type="text" inputmode="decimal" id="costo" placeholder="0,00">
            <div class="stepper">
                <button class="step-btn" tabindex="-1" onclick="step('costo',+1)">＋</button>
                <button class="step-btn" tabindex="-1" onclick="step('costo',-1)">－</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <div class="label-row"><label>Price (€)</label></div>
        <div class="input-wrap">
            <button class="lock-btn" tabindex="-1" id="lock-prezzo" onclick="toggleLock('prezzo')">🔓</button>
            <input type="text" inputmode="decimal" id="prezzo" placeholder="0,00">
            <div class="stepper">
                <button class="step-btn" tabindex="-1" onclick="step('prezzo',+1)">＋</button>
                <button class="step-btn" tabindex="-1" onclick="step('prezzo',-1)">－</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <div class="label-row"><label>Margin (%)</label></div>
        <div class="input-wrap">
            <button class="lock-btn" tabindex="-1" id="lock-margine" onclick="toggleLock('margine')">🔓</button>
            <input type="text" inputmode="decimal" id="margine" placeholder="0,00">
            <div class="stepper">
                <button class="step-btn" tabindex="-1" onclick="step('margine',+1)">＋</button>
                <button class="step-btn" tabindex="-1" onclick="step('margine',-1)">－</button>
            </div>
        </div>
    </div>

    <button class="btn" id="btnCalcola" onclick="calcola()" disabled>Calculate</button>
    <button class="btn-secondary" tabindex="-1" onclick="resetCampi()">Reset</button>
    <div class="hint" id="hint" style="display:none"><b>🔒 Orange field = locked</b><br>Edit the other two — the third updates live</div>
</div>
<script>
    let lockedField=null, outputField=null, fase2=false;
    const IDS=['costo','prezzo','margine'];
    const btn=document.getElementById('btnCalcola');

    function f(id){ return document.getElementById(id); }
    function lb(id){ return document.getElementById('lock-'+id); }

    function getStep(id,val){
        if(id==='margine') return 0.5;
        const v=Math.abs(val);
        if(v<=20) return 0.10; if(v<=100) return 1; if(v<=30000) return 1000; return 10000;
    }
    function rts(v,s){ return Math.round(v*(1/s))/(1/s); }

    function pIT(str){
        if(!str||!str.trim()) return NaN;
        let s=str.trim();
        if(s.includes('.')&&s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
        else if(s.includes(',')) s=s.replace(',','.');
        return parseFloat(s);
    }
    function fIT(num,dec=2){
        if(isNaN(num)) return '';
        return num.toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    }
    function sf(id,n){ f(id).value=fIT(n); }

    function updBtn(){
        if(fase2) return;
        const n=IDS.filter(id=>!isNaN(pIT(f(id).value))).length;
        btn.disabled=n<2; btn.classList.toggle('ready',n>=2);
    }

    function accept(id){
        const v=pIT(f(id).value);
        if(!isNaN(v)){ sf(id,v); f(id).classList.add('accepted'); setTimeout(()=>f(id).classList.remove('accepted'),600); }
        updBtn();
    }

    function goTo(idx){
        const id=IDS[((idx%IDS.length)+IDS.length)%IDS.length];
        f(id).focus(); f(id).select();
    }

    function attachListeners(id, idx){
        f(id).addEventListener('blur',()=>{
            const v=pIT(f(id).value); if(!isNaN(v)) sf(id,v);
            if(!fase2) updBtn();
        });
        f(id).addEventListener('input',()=>{ if(!fase2) updBtn(); else onInput(id); });
        f(id).addEventListener('keydown',e=>{
            if(e.key==='Enter'){
                e.preventDefault();
                if(!fase2){
                    accept(id);
                    if(!btn.disabled){ calcola(); return; }
                    const pv=IDS.findIndex((fid,fi)=>fi>idx&&isNaN(pIT(f(fid).value)));
                    goTo(pv!==-1?pv:idx+1);
                } else { const v=pIT(f(id).value); if(!isNaN(v)) sf(id,v); goTo(idx+1); }
            }
            else if(e.key==='ArrowDown'){ e.preventDefault(); accept(id); goTo(idx+1); }
            else if(e.key==='ArrowUp'){   e.preventDefault(); accept(id); goTo(idx-1); }
        });
    }
    IDS.forEach((id,idx)=>attachListeners(id,idx));

    function step(id,dir){
        if(id===lockedField) return;
        const cur=pIT(f(id).value)||0, d=getStep(id,cur);
        sf(id,Math.max(0,rts(cur+dir*d,d)));
        if(fase2) onInput(id); else updBtn();
    }

    function pFrom(c,m){ return c/(1-m/100); }
    function cFrom(p,m){ return p*(1-m/100); }
    function mFrom(c,p){ return ((p-c)/p)*100; }

    function toggleLock(id){
        if(lockedField===id){
            lockedField=null; lb(id).classList.remove('locked'); lb(id).textContent='🔓'; f(id).classList.remove('locked');
        } else {
            if(lockedField){ lb(lockedField).classList.remove('locked'); lb(lockedField).textContent='🔓'; f(lockedField).classList.remove('locked'); }
            lockedField=id; lb(id).classList.add('locked'); lb(id).textContent='🔒'; f(id).classList.add('locked');
            if(fase2) fixOutput();
        }
    }

    function calcola(){
        const c=pIT(f('costo').value), p=pIT(f('prezzo').value), m=pIT(f('margine').value);
        const cOk=!isNaN(c), pOk=!isNaN(p), mOk=!isNaN(m);
        let cal=null;
        if(cOk&&mOk&&!pOk){ if(m>=100){alert("Margin ≥ 100%.");return;} sf('prezzo',pFrom(c,m)); cal='prezzo'; }
        else if(pOk&&mOk&&!cOk){ if(m>=100){alert("Margin ≥ 100%.");return;} sf('costo',cFrom(p,m)); cal='costo'; }
        else if(cOk&&pOk&&!mOk){ if(p===0){alert("Price cannot be 0.");return;} sf('margine',mFrom(c,p)); cal='margine'; }
        else if(cOk&&pOk&&mOk){ if(p===0){alert("Price cannot be 0.");return;} sf('margine',mFrom(c,p)); cal='margine'; }
        else { alert("Enter at least two values."); return; }
        if(cOk) sf('costo',c); if(pOk) sf('prezzo',p); if(mOk) sf('margine',m);
        outputField=cal; enterFase2();
    }

    function enterFase2(){
        fase2=true; updStili(); btn.disabled=true; btn.classList.remove('ready');
        document.getElementById('hint').style.display='block';
        const sb=document.getElementById('statusBar');
        sb.textContent='Interactive mode — use 🔒 to lock a field'; sb.classList.add('active');
        f(outputField).focus(); f(outputField).select();
    }

    function onInput(changedId){
        if(changedId===lockedField) return;
        if(lockedField){ const t=IDS.find(id=>id!==changedId&&id!==lockedField); if(t){outputField=t;recalc();} }
        else { if(changedId===outputField) outputField=IDS.filter(id=>id!==changedId)[0]; recalc(); }
        updStili();
    }

    function recalc(){
        const c=pIT(f('costo').value), p=pIT(f('prezzo').value), m=pIT(f('margine').value);
        if(outputField==='prezzo'&&!isNaN(c)&&!isNaN(m)&&m<100){ sf('prezzo',pFrom(c,m)); fl(f('prezzo')); }
        else if(outputField==='costo'&&!isNaN(p)&&!isNaN(m)&&m<100){ sf('costo',cFrom(p,m)); fl(f('costo')); }
        else if(outputField==='margine'&&!isNaN(c)&&!isNaN(p)&&p!==0){ sf('margine',mFrom(c,p)); fl(f('margine')); }
    }

    function fixOutput(){
        if(outputField&&outputField!==lockedField) return;
        const a=IDS.find(id=>id!==lockedField&&id!==outputField); if(a) outputField=a; updStili();
    }

    function updStili(){
        IDS.forEach(id=>f(id).classList.remove('locked','output'));
        if(lockedField) f(lockedField).classList.add('locked');
        if(outputField&&outputField!==lockedField) f(outputField).classList.add('output');
    }

    function fl(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),350); }

    function resetCampi(){
        fase2=false; lockedField=null; outputField=null;
        IDS.forEach(id=>{
            const el=f(id), clone=el.cloneNode(true);
            el.parentNode.replaceChild(clone,el);
            clone.value=''; clone.classList.remove('locked','output','flash','accepted');
            const idx=IDS.indexOf(id);
            attachListeners(id,idx);
            lb(id).classList.remove('locked'); lb(id).textContent='🔓';
        });
        btn.disabled=true; btn.classList.remove('ready');
        document.getElementById('hint').style.display='none';
        document.getElementById('statusBar').textContent='Enter two values and press Calculate';
        document.getElementById('statusBar').classList.remove('active');
        goTo(0);
    }
    goTo(0);
</script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
    });
}
</script>
</body>
</html>
